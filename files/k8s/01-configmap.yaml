# ConfigMap — 비밀이 아닌 설정값
#
# docker-compose.yml의 app1/app2에 적었던 environment 중
# "노출돼도 상관없는 값"만 모았다. (POSTGRES_URL, 활성 프로필 등)
# 비밀번호처럼 민감한 값은 여기 넣지 않는다 → 02-secret.yaml 참고.
apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-config
data:
  SPRING_PROFILES_ACTIVE: "postgres"
  POSTGRES_URL: "jdbc:postgresql://postgres:5432/petclinic"
  # postgres Pod에는 PVC(영속 볼륨)를 붙이지 않았기 때문에,
  # Pod가 재시작될 때마다 데이터베이스가 빈 상태로 새로 뜬다.
  # 그래서 매번 스키마를 다시 만들어야 하므로 always를 유지한다.
  # (3주차에서 Named Volume으로 데이터를 지켰던 것과 반대 상황)
  SPRING_SQL_INIT_MODE: "always"
