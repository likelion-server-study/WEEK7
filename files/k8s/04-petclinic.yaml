# petclinic Deployment + Service
#
# docker-compose.yml의 app1 + app2 + nginx 세 개가 하던 일을, 여기서는
# "Deployment(replicas: 2) + Service" 두 개가 대신한다.
# - app1 / app2 두 컨테이너를 각각 만들던 것    → replicas: 2 로 선언만 하면 끝
# - nginx가 하던 로드밸런싱                    → Service가 기본 제공
# - --restart unless-stopped                  → Deployment 컨트롤러가 항상 보장
#
# image는 새로 pull받지 않는다. week6까지 로컬에서
#   ./gradlew bootJar && docker build -t spring-petclinic:dockerfile .
# 로 만들어 둔 이미지를 그대로 재사용한다. Docker Desktop의 쿠버네티스는 같은
# Docker 엔진의 이미지 저장소를 공유하기 때문에, 레지스트리에 올리지 않아도 바로 쓸 수 있다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  labels:
    app: petclinic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
        - name: petclinic
          image: spring-petclinic:dockerfile
          imagePullPolicy: IfNotPresent # 로컬에 있으면 그걸 쓰고, 레지스트리에서 새로 받지 않는다
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: petclinic-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: petclinic-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: petclinic-db-secret
                  key: POSTGRES_PASS
          resources: # docker run --memory 1g --cpus 1 과 같은 역할
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe: # "컨테이너 Up ≠ 앱 UP" (2주차) → 여기서 트래픽을 받을지 말지 결정
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe: # 완전히 멎었으면 kubelet이 컨테이너를 재시작
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic
spec:
  type: LoadBalancer # Docker Desktop 쿠버네티스는 LoadBalancer의 EXTERNAL-IP를 localhost로 매핑해준다
  selector:
    app: petclinic
  ports:
    - port: 8080
      targetPort: 8080
