# Secret — 비밀번호 등 민감한 값
#
# 실습용으로 평문(stringData)을 그대로 적는다. Secret은 자동으로 암호화되는 것이
# 아니라 base64로 인코딩만 되므로, 이 값도 kubectl 접근 권한이 있으면 누구나 볼 수 있다.
# (02-이론.md의 "Secret은 사실 base64" 참고. 실무에서는 Sealed Secrets 등으로 감싸서 사용한다.)
apiVersion: v1
kind: Secret
metadata:
  name: petclinic-db-secret
type: Opaque
stringData:
  POSTGRES_USER: petclinic
  POSTGRES_PASS: petclinic
  POSTGRES_DB: petclinic
