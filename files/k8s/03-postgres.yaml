# postgres Deployment + Service
#
# docker-compose.yml의 postgres 서비스를 쿠버네티스로 옮긴 것이다.
# - depends_on + healthcheck(pg_isready)  → readinessProbe / livenessProbe
# - db-net(internal: true)                → Service를 ClusterIP(기본값)로 두어 외부에 노출하지 않음
# - image: postgres:18.4                  → 동일 이미지, 동일 버전
#
# 이 실습에서는 PVC(영속 볼륨)를 연결하지 않는다. 즉 postgres Pod가 다시 뜨면
# 데이터는 사라진다. 3주차의 Named Volume이 여기서는 빠져 있다는 점을 기억해 둘 것.
# (심화 과제로 직접 PVC를 붙여보는 것을 권장한다 — 02-이론.md 6장 참고)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1 # DB는 여러 개로 늘리지 않는다 (지금 구조에서는 데이터 정합성이 깨진다)
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.4
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: petclinic-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD # postgres 공식 이미지가 요구하는 이름 그대로
              valueFrom:
                secretKeyRef:
                  name: petclinic-db-secret
                  key: POSTGRES_PASS
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: petclinic-db-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe: # pg_isready와 같은 역할: 연결을 받을 준비가 됐는가
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe: # 프로세스가 완전히 멈췄는가 (죽었으면 kubelet이 재시작)
            tcpSocket:
              port: 5432
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres # 이 이름이 곧 클러스터 내부 DNS 주소가 된다 (jdbc:postgresql://postgres:5432/...)
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  # type을 적지 않으면 기본값 ClusterIP → 클러스터 내부에서만 접근 가능.
  # docker-compose의 "ports를 안 연 postgres"와 정확히 같은 상태다.
